<!--
  TRANSACTIONAL BASE: a bare, tokenized shell for any new transactional email
  (receipt, seat invite, expiry warning, subscription change). Copy this file, rename it, fill the
  content slot, keep or delete the optional CTA. Do NOT put a marketing payload in a transactional
  email (it changes its legal status and hurts deliverability).
  Slots: {{EMAIL_HEADING}}, {{EMAIL_BODY_HTML}} (one or more <p> with the same inline style as below),
  optional {{CTA_URL}} + {{CTA_LABEL}} (delete the CTA <table> block if not needed).
  Brand tokens in {{DOUBLE_BRACES}} (see _brand-tokens.md).
  Email-safe: table layout, inline styles, system font stack, no web font, one bulletproof button.
-->
<span style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{PREHEADER}}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f8f7;margin:0;padding:0;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e9edeb;border-radius:14px;">
        <tr>
          <td style="padding:28px 36px 0;">
            <span style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;font-weight:700;color:#0f172a;letter-spacing:-0.02em;">{{BRAND_WORDMARK_HTML}}</span>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 36px 0;">
            <h1 style="margin:0 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:24px;line-height:1.3;font-weight:700;letter-spacing:-0.02em;color:#0f172a;">{{EMAIL_HEADING}}</h1>
            <!-- CONTENT SLOT: one or more paragraphs, each:
                 <p style="margin:0 0 14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#475569;">...</p> -->
            {{EMAIL_BODY_HTML}}
            <!-- OPTIONAL CTA (delete this table if the email needs no action) -->
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0 6px;">
              <tr>
                <td align="center" bgcolor="{{BRAND_ACCENT}}" style="border-radius:8px;">
                  <a href="{{CTA_URL}}" style="display:inline-block;padding:13px 30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">{{CTA_LABEL}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:26px 36px 30px;">
            <div style="border-top:1px solid #eef2f0;padding-top:18px;">
              <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#94a3b8;">{{BRAND_NAME}}, {{SENDER_TAGLINE}}.<br>Sent by {{FOOTER_IDENTITY}}.</p>
            </div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
